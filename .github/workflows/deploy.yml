name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/setup-google-stitch-api-JvGYS', 'main']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== Verifying dist/index.html exists ==="
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html does not exist! Build may have failed."
            exit 1
          fi
          echo "=== dist/ directory contents ==="
          ls -la dist/
          echo "=== First 5 lines of dist/index.html ==="
          cat dist/index.html | head -5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
